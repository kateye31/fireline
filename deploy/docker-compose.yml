# Full stack for one Azure Linux VM (no GPU needed):
#   caddy    -> HTTPS on 443 (automatic Let's Encrypt cert), proxies to fireline
#   fireline -> web app + API + simulated satellite link (port 8000 inside)
#   gemma    -> Ollama serving Gemma on CPU with an OpenAI-compatible API (port 11434 inside)
#
#   cd deploy && cp ../.env.example .env   # set SITE_ADDRESS
#   docker compose up -d --build
services:
  fireline:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      GEMMA_BASE_URL: http://gemma:11434/v1
    volumes:
      - fireline-data:/data
    # No depends_on gemma on purpose: the site works (template summaries) while Gemma is still downloading.

  gemma:
    image: ollama/ollama:0.6.8
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # Start the server, pull the model on first boot (about 3 GB for gemma3:4b), then keep serving.
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull ${GEMMA_MODEL:-gemma3:4b}; wait"]

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - fireline

volumes:
  fireline-data:
  ollama-models:
  caddy-data:
